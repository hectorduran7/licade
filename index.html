<!DOCTYPE html>
<html lang="es" data-theme="blue" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>La Biblioteca de ADE | UNGS</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- CSS Module -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Anti-Inspection & DevTools Protection -->
    <script src="protection.js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PQGH6R9SZC"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-PQGH6R9SZC');
    </script>

    <!-- Firebase Compat v10.13.0 -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Theme pre-init -->
    <script>
        const savedTheme = localStorage.getItem('ungs_theme') || 'blue';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const savedMode = localStorage.getItem('ungs_mode') || 'dark';
        if (savedMode === 'light') document.documentElement.setAttribute('data-light', '1');
    </script>
</head>
<body>

    <div class="bg-mesh"></div>
    <div class="bg-spotlight"></div>

    <!-- Sidebar Mount Point (sidebar.js injects here) -->
    <div id="sidebar-mount"></div>

    <!-- MAIN APP CONTENT -->
    <main class="app-container">
        
        <!-- Academic Header -->
        <header class="page-header">
            <!-- Top Quick Links -->
            <div class="quick-links-pill">
                <a href="https://guarani3w.ungs.edu.ar/" target="_blank" class="ql-link">
                    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    SIU Guaraní
                </a>
                <div class="ql-divider"></div>
                <a href="https://moodle.ungs.edu.ar/" target="_blank" class="ql-link">
                    <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                    Campus Virtual
                </a>
                <div class="ql-divider"></div>
                <a href="Contactos_Docentes.pdf" target="_blank" class="ql-link">
                    <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    Mails Docentes
                </a>
            </div>

            <h1 class="page-title" style="margin-bottom: 12px;">La Biblioteca de ADE</h1>
            <p class="page-subtitle" style="margin-bottom: 32px;">Licenciatura en Administración de Empresas &bull; Material y Recursos</p>
        </header>

        <!-- Promo Banners -->
        <div class="promo-banners-container">
            <!-- Particulares -->
            <div class="promo-banner">
                <div class="promo-banner-left">
                    <div class="promo-icon-box">
                        <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                    </div>
                    <div class="promo-text-wrap">
                        <div class="promo-title">¿Das clases particulares?</div>
                        <div class="promo-subtitle">Llegá a más estudiantes de la carrera.</div>
                    </div>
                </div>
                <button class="btn-promo" onclick="window.open('mailto:bibliotecaadeungs@gmail.com', '_blank')">
                    <svg viewBox="0 0 24 24"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
                    Más información
                </button>
            </div>

            <!-- Consejos -->
            <div class="promo-banner-inline" id="bannerConsejos">
                <div class="promo-icon-small">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </div>
                <div class="promo-text-inline">
                    <strong>¿Tenés consejos de cursada?</strong> Sumá tu recomendación docente desde el menú de la izquierda.
                </div>
                <button class="btn-close-promo" onclick="document.getElementById('bannerConsejos').style.display='none'">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>

        <!-- Spotlight Search -->
        <div class="search-wrapper">
            <div class="search-icon-left">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar materia o correlativa (ej. Economía)..." oninput="if(window.renderApp) window.renderApp()" autocomplete="off" spellcheck="false">
            <div class="search-hint-right">⌘K</div>
        </div>

        <!-- Segmented Control Tabs -->
        <div class="tabs-container" id="tabsContainer"></div>

        <!-- Subjects Grid -->
        <div id="subjectsContainer" class="grid-container"></div>
        
    </main>

    <!-- Modulos JS Secuenciales -->
    <script src="js/materias-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
