<!DOCTYPE html>
<html lang="es" data-theme="green">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mantenimiento - La Biblioteca ADE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #22c55e;
            --primary-glow: rgba(34, 197, 94, 0.2);
            --bg-base: #000000;
            --bg-rail: rgba(12, 12, 14, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #F5F5F7;
            --text-muted: #86868b;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bg-mesh {
            position: fixed; inset: 0; z-index: -2;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px; opacity: 0.4; pointer-events: none;
        }

        .bg-spotlight {
            position: fixed; top: -20vh; left: 50%; transform: translateX(-50%);
            width: 80vw; height: 60vh;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.06) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        .maintenance-container {
            text-align: center;
            padding: 40px;
            background: rgba(16, 16, 20, 0.95);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 1px 1px 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 480px;
            width: 90%;
            animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .icon-container {
            width: 80px; height: 80px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            background: var(--primary-glow);
            color: var(--primary);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 40px var(--primary-glow);
        }

        .icon-container svg {
            width: 40px; height: 40px;
            stroke-width: 1.5;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #ffffff;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 14.5px; color: var(--text-muted); line-height: 1.5;
            font-weight: 400;
        }

        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="bg-spotlight"></div>
    
    <div class="maintenance-container">
        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
        <h1>Estamos mejorando La Biblioteca</h1>
        <p>La plataforma se encuentra temporalmente cerrada por mantenimiento y actualización de servidores. Volveremos a estar en línea en unos días con una experiencia más rápida y estable.</p>
    </div>
</body>
</html>
